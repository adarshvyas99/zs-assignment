---
- name: Ensure Kubernetes is running
  command: kubectl cluster-info

- name: Download Helm install script
  get_url:
    url: "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3"
    dest: "/tmp/get_helm.sh"
    mode: "0755"

- name: Install Helm
  command: /tmp/get_helm.sh

- name: Add Helm repository
  command: helm repo add sonarqube "https://SonarSource.github.io/helm-chart-sonarqube"
    
- name: Update Helm repositories
  command: helm repo update

- name: Install pip on managed node
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: Check pip version
  ansible.builtin.command: pip3 --version
  register: pip_version
  changed_when: false

- debug:
    msg: "Pip version: {{ pip_version.stdout }}"

- name: Install Kubernetes Python dependencies
  ansible.builtin.pip:
    name:
      - openshift
      - pyyaml
      - kubernetes

- name: Ensure vagrant owns kubectl and kind
  file:
    path: "{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - /usr/local/bin/kind
    - /usr/local/bin/kubectl
    
