- name: Create a k8s namespace for Sonarqube
  shell: kubectl create namespace sonarqube --dry-run=client -o yaml | kubectl apply -f -
  become: true

# - name: Create a k8s namespace for Sonarqube
#   k8s:
#     name: sonarqube
#     api_version: v1
#     kind: Namespace
#     state: present
#     kubeconfig: "/home/vagrant/.kube/config"

- name: Copy values.yaml to Managed Node
  copy:
    src: /home/vagrant/ansible/roles/sonarqube/vars/values.yml
    dest: /home/vagrant/values.yaml
    mode: '0644'

- name: Check if SonarQube is already installed
  ansible.builtin.command: "helm list -n sonarqube --filter '^sonarqube$'"
  register: helm_status
  changed_when: false
  failed_when: false

- name: Deploy SonarQube using Helm
  command: >
    helm upgrade --install sonarqube sonarqube/sonarqube \
    --namespace sonarqube \
    -f /home/vagrant/values.yaml
  when: helm_status.stdout == ""

- name: Wait for SonarQube to be ready
  command: kubectl wait --for=condition=available --timeout=300s statefulset/sonarqube-sonarqube -n sonarqube
  when: helm_status.stdout == ""

