
---
    - name: Install dependencies
      ansible.builtin.apt:
        name: ["curl", "git", "apt-transport-https", "ca-certificates", "gnupg"]
        update_cache: yes

    - name: Add an apt signing key for Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/trusted.gpg.d/docker.asc
        mode: '0644'

    - name: Add apt repository for stable version
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present
        filename: docker

    - name: Install Docker and dependencies
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes
      notify: Restart Docker

    - name: Ensure 'docker' group exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add vagrant user to docker group
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: yes

    - name: Download Kind binary
      ansible.builtin.get_url:
        url: https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Fetch latest stable kubectl version
      ansible.builtin.shell: "curl -Ls https://dl.k8s.io/release/stable.txt"
      register: kubectl_version
      changed_when: false

    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Ensure vagrant owns kubectl and kind
      file:
        path: "{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - /usr/local/bin/kind
        - /usr/local/bin/kubectl

    - name: Create Kind cluster
      command: kind create cluster --name kind-cluster --image kindest/node:v1.32.2
      register: kind_result
      changed_when: "'Cluster creation complete' in kind_result.stdout"
      ignore_errors: true

    - name: Verify Kind cluster
      command: kubectl get nodes
      register: cluster_status

    # # - name: Configure kubectl for ansible_user
    # #   file:
    # #     path: "/home/{{ ansible_user }}/.kube"
    # #     state: directory
    # #     mode: '0755'
    # #     owner: "{{ ansible_user }}"
    # #     group: "{{ ansible_user }}"

    - name: Copy conf for kubectl configuration for ansible_user
      copy:
        src: /root/.kube/config
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Debug cluster output
      debug:
        msg: "{{ cluster_status.stdout_lines }}"