- name: Install unzip package (if missing)
  ansible.builtin.package:
    name: unzip
    state: present

- name: Install SonarQube Scanner
  ansible.builtin.get_url:
    url: "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip"
    dest: "/tmp/sonar-scanner.zip"

- name: Unzip SonarQube Scanner
  ansible.builtin.unarchive:
    src: "/tmp/sonar-scanner.zip"
    dest: "/opt/"
    remote_src: yes

- name: Add Sonar Scanner to PATH
  ansible.builtin.lineinfile:
    path: "/etc/profile"
    line: 'export PATH=$PATH:/opt/sonar-scanner-5.0.1.3006-linux/bin'
    create: yes

- name: Scan Node.js repository
  command: >
    /opt/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner
     -Dsonar.projectKey=nodejs
     -Dsonar.sources=/home/vagrant/nodejs
     -Dsonar.language=js
     -Dsonar.host.url={{ sonar_host }}
     -Dsonar.login={{ sonar_token }}
  register: node_scan_output
  ignore_errors: true

- name: Scan Python repository
  command: >
    /opt/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner
     -Dsonar.projectKey=python
     -Dsonar.sources=/home/vagrant/python
     -Dsonar.language=js
     -Dsonar.host.url={{ sonar_host }}
     -Dsonar.login={{ sonar_token }}
  register: python_scan_output
  ignore_errors: true

- name: Retrieve SonarQube Issues Count
  ansible.builtin.uri:
    url: "{{ sonar_host }}/api/issues/search?componentKeys=nodejs"
    method: GET
    headers:
      Authorization: "Basic {{ (sonar_token + ':') | b64encode }}"
  register: node_sonar_issues

- name: Retrieve SonarQube Issues Count
  ansible.builtin.uri:
    url: "{{ sonar_host }}/api/issues/search?componentKeys=python"
    method: GET
    headers:
      Authorization: "Basic {{ (sonar_token + ':') | b64encode }}"
  register: python_sonar_issues

