- name: Check if SonarQube Token File Exists
  ansible.builtin.stat:
    path: /home/vagrant/sonarqube_token.txt
  register: sonar_token_file

# - name: Read existing SonarQube Token if file exists
#   ansible.builtin.set_fact:
#     sonar_token: "{{ lookup('file', '/home/vagrant/sonarqube_token.txt') }}"
#   when: sonar_token_file.stat.exists

- name: Read existing SonarQube Token if file exists
  ansible.builtin.slurp:
    src: /home/vagrant/sonarqube_token.txt
  register: sonar_token_content
  when: sonar_token_file.stat.exists

- name: Set sonar_token fact from existing file
  ansible.builtin.set_fact:
    sonar_token: "{{ sonar_token_content.content | b64decode }}"
  when: sonar_token_file.stat.exists

- name: Generate SonarQube Token (if not already generated)
  ansible.builtin.uri:
    url: "http://localhost:9000/api/user_tokens/generate"
    method: POST
    user: "admin"
    password: "admin"
    force_basic_auth: yes
    body_format: form-urlencoded
    body:
      name: "zopstix-ansible-token-2"
  register: sonar_token_response
  when: not sonar_token_file.stat.exists

- name: Store the generated SonarQube Token
  ansible.builtin.copy:
    content: "{{ sonar_token_response.json.token }}"
    dest: /home/vagrant/sonarqube_token.txt
    mode: "0600"
    owner: vagrant
    group: vagrant
  when: not sonar_token_file.stat.exists

- name: Set sonar_token fact from generated value
  ansible.builtin.set_fact:
    sonar_token: "{{ sonar_token_response.json.token }}"
  when: not sonar_token_file.stat.exists

