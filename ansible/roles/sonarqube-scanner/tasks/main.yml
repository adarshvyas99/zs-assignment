- name: Get SonarQube NodePort
  ansible.builtin.command: "kubectl get svc sonarqube-sonarqube -n sonarqube -o jsonpath='{.spec.ports[0].nodePort}'"
  register: sonar_nodeport
  changed_when: false

- name: Get Kubernetes Node Internal IP
  ansible.builtin.command: "kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type==\"InternalIP\")].address}'"
  register: sonar_internal_ip
  changed_when: false

- name: Set SonarQube Host Variable
  set_fact:
    sonar_host: "http://{{ sonar_internal_ip.stdout }}:{{ sonar_nodeport.stdout }}"

- name: Clone Node.js repository
  git:
    repo: "https://github.com/rambler-digital-solutions/rship.git"
    dest: "/home/vagrant/nodejs"
    version: master
    force: yes

- name: Clone Python repository
  git:
    repo: "https://github.com/Toxic-Noob/ToxicBomber.git"
    dest: "/home/vagrant/python"
    version: main
    force: yes

