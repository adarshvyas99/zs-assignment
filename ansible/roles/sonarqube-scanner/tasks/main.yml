- name: Display nodejs SonarQube Scan Results
  debug:
    msg: |
      Node.js Scan Output:
      {{ node_scan_output.stdout }}

- name: Display python SonarQube Scan Results
  debug:
    msg: |
      Python Scan Output:
      {{ python_scan_output.stdout }}

- name: Save nodejs scan results to a file
  copy:
    content: |
      Node.js Scan Output:
      {{ node_scan_output.stdout }}
    dest: "/tmp/sonarqube_node_scan_results.log"

- name: Save python scan results to a file
  copy:
    content: |
      Node.js Scan Output:
      {{ python_scan_output.stdout }}
    dest: "/tmp/sonarqube_python_scan_results.log"

- name: Extract Sonar Task ID from SonarQube Output for node
  set_fact:
    sonar_node_task_id: "{{ node_scan_output | regex_findall('task\\?id=([a-f0-9\\-]+)') | first }}"

- name: Extract Sonar Task ID from SonarQube Output for python
  set_fact:
    sonar_python_task_id: "{{ python_scan_output | regex_findall('task\\?id=([a-f0-9\\-]+)') | first }}"

- name: Debug extracted Sonar Task ID for node
  debug:
    msg: "Sonar Task ID is {{ sonar_node_task_id }}"

- name: Debug extracted Sonar Task ID for python
  debug:
    msg: "Sonar Task ID is {{ sonar_python_task_id }}"

- name: Send SonarQube Scan Result to Slack for node
  community.general.slack:
    token: "{{ slack_token }}"
    msg: |
      🚀 *SonarQube Scan Completed*
      *Project:* Node.js
      *Status:* SUCCESS ✅
      *Report:* <{{ sonar_host }}/dashboard?id=nodejs|View SonarQube Report>
      *Processing:* <{{ sonar_host }}/api/ce/task?id={{ sonar_node_task_id }}|View Processing Task>
      *Issues:* {{ node_sonar_issues.json.paging.total }} 🚨 
    channel: "#sonarqube-alerts"
    username: "SonarQubeBot"
    icon_emoji: ":robot_face:"
  when: node_scan_output is success 

- name: Send SonarQube Scan Result to Slack for python
  community.general.slack:
    token: "{{ slack_token }}"
    msg: |
      🚀 *SonarQube Scan Completed*
      *Project:* Python
      *Status:* SUCCESS ✅
      *Report:* <{{ sonar_host }}/dashboard?id=nodejs|View SonarQube Report>
      *Processing:* <{{ sonar_host }}/api/ce/task?id={{ sonar_python_task_id }}|View Processing Task>
      *Issues:* {{ python_sonar_issues.json.paging.total }} 🚨 
    channel: "#sonarqube-alerts"
    username: "SonarQubeBot"
    icon_emoji: ":robot_face:"
  when: node_scan_output is success 